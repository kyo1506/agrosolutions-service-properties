name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'k8s/production/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

env:
  AWS_REGION: sa-east-1
  EKS_CLUSTER_NAME: agrosolutions-eks-cluster
  ECR_REPOSITORY: agrosolutions-properties-api
  NAMESPACE: agrosolutions-properties
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore AgroSolutions.Properties.sln

    - name: Build solution
      run: dotnet build AgroSolutions.Properties.sln -c Release --no-restore

    - name: Run tests
      run: dotnet test AgroSolutions.Properties.sln --no-build --configuration Release --verbosity normal

  deploy-to-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: ${{ github.event.inputs.environment || 'production' }}

    permissions:
      id-token: write   # necessário para OIDC
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role-session-name: GitHubActions-PropertiesDeploy-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS connection
      run: |
        echo "Verificando credenciais AWS..."
        aws sts get-caller-identity
        echo "Verificando cluster EKS..."
        aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        REVISION=${GITHUB_SHA::8}
        IMAGE_TAG=${GITHUB_SHA}
        IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        echo "Building Docker image..."
        docker build \
          --build-arg BUILD_DATE=$BUILD_DATE \
          --build-arg VERSION=1.0.0 \
          --build-arg REVISION=$REVISION \
          -t $IMAGE \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .

        echo "Pushing to ECR..."
        docker push $IMAGE
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "✅ Image pushed successfully: $IMAGE"

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --name ${{ env.EKS_CLUSTER_NAME }} \
          --region ${{ env.AWS_REGION }}

    - name: Verify kubectl connection
      run: |
        kubectl version --client
        kubectl cluster-info
        kubectl get nodes

    - name: Create namespace (if not exists)
      run: |
        kubectl apply -f k8s/production/namespace.yaml

    - name: Apply Infrastructure (ServiceAccount, IRSA)
      run: |
        kubectl apply -f k8s/production/infrastructure.yaml

    - name: Apply Resource Configs (Quotas, LimitRanges, PDB)
      run: |
        kubectl apply -f k8s/production/resource-configs.yaml

    - name: Create secrets (if needed)
      run: |
        EFFECTIVE_PASSWORD=""

        # 1) Try to reuse current DB pod password (avoids drift with initialized PostgreSQL data)
        DB_POD=$(kubectl get pod -n ${{ env.NAMESPACE }} -l app=properties-db -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -n "$DB_POD" ]; then
          EFFECTIVE_PASSWORD=$(kubectl exec -n ${{ env.NAMESPACE }} "$DB_POD" -- printenv POSTGRES_PASSWORD 2>/dev/null || true)
          if [ -n "$EFFECTIVE_PASSWORD" ]; then
            echo "✅ Senha obtida do pod do banco em execução"
          fi
        fi

        # 2) Fallback to existing secret password
        if [ -z "$EFFECTIVE_PASSWORD" ] && kubectl get secret database-secrets -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
          EFFECTIVE_PASSWORD=$(kubectl get secret database-secrets -n ${{ env.NAMESPACE }} -o jsonpath='{.data.postgres-password}' | base64 -d)
          if [ -n "$EFFECTIVE_PASSWORD" ]; then
            echo "✅ Senha obtida do secret existente"
          fi
        fi

        # 3) Bootstrap fallback from GitHub secret (first deploy)
        if [ -z "$EFFECTIVE_PASSWORD" ]; then
          EFFECTIVE_PASSWORD="$POSTGRES_PASSWORD"
        fi

        if [ -z "$EFFECTIVE_PASSWORD" ]; then
          echo "❌ Não foi possível determinar a senha do PostgreSQL"
          echo "Defina POSTGRES_PASSWORD no GitHub Secrets ou crie database-secrets no cluster"
          exit 1
        fi

        CONNECTION_STRING="Host=properties-db-service;Port=5432;Database=agrosolutions_properties;Username=postgres;Password=$EFFECTIVE_PASSWORD"

        # Create/update database-secrets with effective password used by DB
        kubectl create secret generic database-secrets \
          --from-literal=postgres-user=postgres \
          --from-literal=postgres-password="$EFFECTIVE_PASSWORD" \
          --from-literal=connection-string="$CONNECTION_STRING" \
          --from-literal=postgres-exporter-dsn="postgresql://postgres:$EFFECTIVE_PASSWORD@properties-db-service:5432/agrosolutions_properties?sslmode=disable" \
          --namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        DECODED_CONN=$(kubectl get secret database-secrets -n ${{ env.NAMESPACE }} -o jsonpath='{.data.connection-string}' | base64 -d)
        if echo "$DECODED_CONN" | grep -Eq 'Password=.+$'; then
          echo "✅ Connection string gravada com senha"
        else
          echo "❌ Connection string inválida (senha ausente)"
          exit 1
        fi
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    - name: Apply Storage Class and Volumes
      run: |
        kubectl apply -f k8s/production/storage-class.yaml
        kubectl apply -f k8s/production/volumes.yaml

    - name: Apply ConfigMaps
      run: |
        kubectl apply -f k8s/production/configmaps.yaml

    - name: Apply Services
      run: |
        kubectl apply -f k8s/production/services.yaml

    - name: Apply Database Deployment
      run: |
        kubectl apply -f k8s/production/databases.yaml
        echo "Waiting for database to be ready..."
        kubectl wait --for=condition=ready pod -l app=properties-db -n ${{ env.NAMESPACE }} --timeout=300s || echo "Database not ready yet, continuing..."

    - name: Apply API Deployment
      run: |
        kubectl apply -f k8s/production/deployment.yaml
        SET_IMAGE_OUTPUT=$(kubectl set image deployment/properties-api \
          properties-api=${{ steps.build-image.outputs.image }} \
          -n ${{ env.NAMESPACE }})
        echo "$SET_IMAGE_OUTPUT"

        if echo "$SET_IMAGE_OUTPUT" | grep -qi "updated"; then
          kubectl rollout status deployment/properties-api -n ${{ env.NAMESPACE }} --timeout=5m
        else
          echo "Imagem já aplicada. Reiniciando deployment para aplicar secrets/config atualizados..."
          kubectl rollout restart deployment/properties-api -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/properties-api -n ${{ env.NAMESPACE }} --timeout=5m
        fi

    - name: Apply HPA
      run: |
        kubectl apply -f k8s/production/hpa.yaml

    - name: Apply Ingress
      run: |
        kubectl apply -f k8s/production/ingress-aws.yaml

    - name: Apply Observability (if exists)
      run: |
        kubectl apply -f k8s/production/observability.yaml || echo "Observability manifests not found, skipping..."

    - name: Verify deployment
      run: |
        echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
        kubectl get deployments -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Pods" >> $GITHUB_STEP_SUMMARY
        kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Services" >> $GITHUB_STEP_SUMMARY
        kubectl get services -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Ingress" >> $GITHUB_STEP_SUMMARY
        kubectl get ingress -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY

    - name: Run health check
      run: |
        echo "Waiting for pods to be ready..."
        kubectl wait --for=condition=ready pod \
          -l app=properties-api \
          -n ${{ env.NAMESPACE }} \
          --timeout=300s
        
        echo "Checking health endpoints..."
        POD_NAME=$(kubectl get pod -l app=properties-api -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n ${{ env.NAMESPACE }} $POD_NAME -- wget -qO- http://localhost:8080/health || echo "Health check failed"

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment successful!" >> $GITHUB_STEP_SUMMARY
        echo "Environment: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
        echo "Image: ${{ steps.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
        echo "Namespace: ${{ env.NAMESPACE }}" >> $GITHUB_STEP_SUMMARY

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!" >> $GITHUB_STEP_SUMMARY
        echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Diagnostics" >> $GITHUB_STEP_SUMMARY
        kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY || true
        kubectl describe deployment properties-api -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY || true
