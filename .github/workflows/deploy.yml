name: AgroSolutions Properties - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: agrosolutions-properties-api
  EKS_CLUSTER_NAME: agrosolutions-eks-cluster
  AWS_REGION: sa-east-1
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore AgroSolutions.Properties.sln

      - name: Build solution
        run: dotnet build AgroSolutions.Properties.sln -c Release --no-restore

      - name: Run tests
        run: |
          cd tests/AgroSolutions.Properties.Tests/
          dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"

  deploy-to-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # Required for OIDC
      contents: read    # Required to checkout code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-PropertiesDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS connection
        run: |
          echo "Verificando credenciais AWS..."
          aws sts get-caller-identity
          echo "Verificando cluster EKS..."
          aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          VERSION: "1.0.0"
        run: |
          echo "Building Docker image..."
          docker build \
            --build-arg BUILD_DATE=$BUILD_DATE \
            --build-arg VERSION=$VERSION \
            --build-arg REVISION=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure Kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl version --client

      - name: Verify EKS connection
        run: |
          echo "Verificando conectividade com EKS..."
          kubectl cluster-info
          kubectl get nodes
          echo "Namespaces existentes:"
          kubectl get namespaces

      - name: Deploy to EKS
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Imagem a ser deployada: ${{ steps.build-image.outputs.image }}"

          # Substituir placeholder da imagem no deployment
          sed -i 's|316295889438.dkr.ecr.sa-east-1.amazonaws.com/agrosolutions-properties-api:latest|${{ steps.build-image.outputs.image }}|g' k8s/production/deployment.yaml

          echo "Verificando substituição da imagem:"
          grep "image:" k8s/production/deployment.yaml | head -5

          # Aplicar manifestos na ordem correta
          echo "📦 Aplicando namespace..."
          kubectl apply -f k8s/production/namespace.yaml

          # Criar secrets APÓS namespace existir
          echo "🔐 Criando/atualizando secrets do Kubernetes..."

          # Determinar senha efetiva do PostgreSQL (evitar drift)
          EFFECTIVE_PASSWORD=""

          # 1) Tentar reutilizar a senha do pod do DB em execução
          DB_POD=$(kubectl get pod -n agrosolutions-properties -l app=properties-db -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$DB_POD" ]; then
            EFFECTIVE_PASSWORD=$(kubectl exec -n agrosolutions-properties "$DB_POD" -c postgres -- printenv POSTGRES_PASSWORD 2>/dev/null || true)
            if [ -n "$EFFECTIVE_PASSWORD" ]; then
              echo "✅ Senha obtida do pod do banco em execução"
            fi
          fi

          # 2) Fallback: senha do secret existente no cluster
          if [ -z "$EFFECTIVE_PASSWORD" ] && kubectl get secret database-secrets -n agrosolutions-properties >/dev/null 2>&1; then
            EFFECTIVE_PASSWORD=$(kubectl get secret database-secrets -n agrosolutions-properties -o jsonpath='{.data.postgres-password}' | base64 -d)
            if [ -n "$EFFECTIVE_PASSWORD" ]; then
              echo "✅ Senha obtida do secret existente"
            fi
          fi

          # 3) Bootstrap: GitHub secret (primeiro deploy)
          if [ -z "$EFFECTIVE_PASSWORD" ]; then
            EFFECTIVE_PASSWORD="$POSTGRES_PASSWORD"
            if [ -n "$EFFECTIVE_PASSWORD" ]; then
              echo "✅ Senha obtida do GitHub Secret (bootstrap)"
            fi
          fi

          if [ -z "$EFFECTIVE_PASSWORD" ]; then
            echo "❌ Não foi possível determinar a senha do PostgreSQL"
            echo "Defina POSTGRES_PASSWORD no GitHub Secrets ou crie database-secrets no cluster"
            exit 1
          fi

          CONNECTION_STRING="Host=properties-db-service;Port=5432;Database=agrosolutions_properties;Username=postgres;Password=$EFFECTIVE_PASSWORD"

          # Database Secrets
          kubectl create secret generic database-secrets \
            --from-literal=postgres-user=postgres \
            --from-literal=postgres-password="$EFFECTIVE_PASSWORD" \
            --from-literal=connection-string="$CONNECTION_STRING" \
            --from-literal=postgres-exporter-dsn="postgresql://postgres:$EFFECTIVE_PASSWORD@properties-db-service:5432/agrosolutions_properties?sslmode=disable" \
            -n agrosolutions-properties --dry-run=client -o yaml | kubectl apply -f -

          # Validar connection string
          DECODED_CONN=$(kubectl get secret database-secrets -n agrosolutions-properties -o jsonpath='{.data.connection-string}' | base64 -d)
          if echo "$DECODED_CONN" | grep -Eq 'Password=.+'; then
            echo "✅ Secrets configurados com sucesso!"
          else
            echo "❌ Connection string inválida (senha ausente)"
            exit 1
          fi

          echo "🔧 Aplicando ConfigMaps..."
          kubectl apply -f k8s/production/configmaps.yaml

          echo "💾 Aplicando Storage Class e Volumes..."
          kubectl apply -f k8s/production/storage-class.yaml
          kubectl apply -f k8s/production/volumes.yaml

          echo "🗄️ Deployando banco de dados..."
          kubectl apply -f k8s/production/databases.yaml

          echo "📡 Aplicando Services..."
          kubectl apply -f k8s/production/services.yaml

          echo "☁️ Aplicando Infrastructure configs..."
          kubectl apply -f k8s/production/infrastructure.yaml

          echo "⏳ Aguardando banco de dados ficar pronto..."
          kubectl wait --for=condition=ready pod -l app=properties-db -n agrosolutions-properties --timeout=300s || true

          echo "🚀 Aplicando deployment da aplicação..."
          kubectl apply -f k8s/production/deployment.yaml

          echo "🔄 Aplicando HPA..."
          kubectl apply -f k8s/production/hpa.yaml

          echo "⚙️ Aplicando Resource Configs..."
          kubectl apply -f k8s/production/resource-configs.yaml

          echo "📊 Aplicando Observability..."
          kubectl apply -f k8s/production/observability.yaml || echo "Observability manifests not found, skipping..."

          echo "✅ Manifestos aplicados com sucesso!"

      - name: Verify Deployment
        run: |
          echo "🔍 Verificando status do deploy..."

          echo "Pods:"
          kubectl get pods -n agrosolutions-properties

          echo "Services:"
          kubectl get svc -n agrosolutions-properties

          # Aguardar rollout do deployment
          echo "⏳ Aguardando rollout da Properties API..."
          kubectl rollout status deployment/properties-api -n agrosolutions-properties --timeout=300s

          # Status final
          echo "📊 Status final dos deployments:"
          kubectl get deployments -n agrosolutions-properties
          kubectl get pods -n agrosolutions-properties -o wide

          # HPA status
          echo "📈 Status do HPA:"
          kubectl get hpa -n agrosolutions-properties

          # Teste de saúde interno via kubectl exec
          echo "🏥 Testando health endpoint internamente..."
          POD_NAME=$(kubectl get pod -l app=properties-api -n agrosolutions-properties -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD_NAME" ]; then
            for i in {1..3}; do
              echo "Tentativa $i/3 - Health check via pod..."
              HEALTH_RESULT=$(kubectl exec -n agrosolutions-properties "$POD_NAME" -- wget -qO- http://localhost:8080/health/ready 2>/dev/null || true)
              if [ -n "$HEALTH_RESULT" ]; then
                echo "✅ Health check passou: $HEALTH_RESULT"
                break
              else
                echo "⚠️ Health check não respondeu, aguardando 10s..."
                sleep 10
              fi
            done
          else
            echo "⚠️ Pod não encontrado para health check interno"
          fi

          echo "🚀 Deploy concluído com sucesso!"

      - name: Deployment Summary
        if: success()
        run: |
          echo "📊 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build: SUCCESS"
          echo "✅ Docker Image: ${{ steps.build-image.outputs.image }}"
          echo "✅ Deployment: SUCCESS"
          echo "🌍 Environment: Production (AWS EKS)"
          echo "📅 Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🆔 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou. Executando rollback..."

          if kubectl cluster-info &> /dev/null; then
            echo "Conexão com Kubernetes OK, executando rollback..."

            if kubectl get deployment properties-api -n agrosolutions-properties &> /dev/null; then
              # Verificar se existe histórico de rollout antes de tentar rollback
              HISTORY=$(kubectl rollout history deployment/properties-api -n agrosolutions-properties 2>&1 || true)
              if echo "$HISTORY" | grep -q "REVISION"; then
                REVISION_COUNT=$(echo "$HISTORY" | grep -c "^[0-9]" || true)
                if [ "$REVISION_COUNT" -gt "1" ]; then
                  echo "⏪ Fazendo rollback da Properties API..."
                  kubectl rollout undo deployment/properties-api -n agrosolutions-properties || true
                else
                  echo "⚠️ Apenas uma revisão encontrada, rollback não é possível (primeiro deploy)"
                fi
              else
                echo "⚠️ Sem histórico de rollout disponível"
              fi
            fi

            echo "📋 Logs do pod com falha:"
            kubectl logs -n agrosolutions-properties -l app=properties-api --tail=50 || true

            echo "📋 Describe do deployment:"
            kubectl describe deployment properties-api -n agrosolutions-properties || true

            echo "📋 Events do namespace:"
            kubectl get events -n agrosolutions-properties --sort-by='.lastTimestamp' | tail -20 || true

            echo "✅ Diagnóstico concluído. Verifique os logs para detalhes do erro."
          else
            echo "❌ Não foi possível conectar ao Kubernetes. Rollback manual necessário."
            exit 1
          fi
