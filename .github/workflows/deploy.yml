name: AgroSolutions Properties - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: agrosolutions-properties-api
  EKS_CLUSTER_NAME: agrosolutions-eks-cluster
  AWS_REGION: sa-east-1
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore AgroSolutions.Properties.sln

      - name: Build solution
        run: dotnet build AgroSolutions.Properties.sln -c Release --no-restore

      - name: Run tests
        run: |
          cd tests/AgroSolutions.Properties.Tests/
          dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"

  deploy-to-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS connection
        run: |
          echo "Verificando credenciais AWS..."
          aws sts get-caller-identity
          echo "Verificando cluster EKS..."
          aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          VERSION: "1.0.0"
        run: |
          echo "Building Docker image..."
          docker build \
            --build-arg BUILD_DATE=$BUILD_DATE \
            --build-arg VERSION=$VERSION \
            --build-arg REVISION=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure Kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl version --client

      - name: Verify EKS connection
        run: |
          echo "Verificando conectividade com EKS..."
          kubectl cluster-info
          kubectl get nodes
          echo "Namespaces existentes:"
          kubectl get namespaces

      - name: Create Kubernetes secrets
        run: |
          # Verificar se secrets já existem, se não, criar
          echo "Criando/atualizando secrets do Kubernetes..."
          
          # Database Secrets
          kubectl create secret generic database-secrets \
            --from-literal=postgres-user=postgres \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=connection-string="Host=properties-db-service;Port=5432;Database=agrosolutions_properties;Username=postgres;Password=${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=postgres-exporter-dsn="postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@properties-db-service:5432/agrosolutions_properties?sslmode=disable" \
            -n agrosolutions-properties --dry-run=client -o yaml | kubectl apply -f -
          
          # AWS Credentials
          kubectl create secret generic aws-credentials \
            --from-literal=access-key-id=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=secret-access-key=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -n agrosolutions-properties --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ Secrets configurados com sucesso!"

      - name: Deploy to EKS
        run: |
          echo "Imagem a ser deployada: ${{ steps.build-image.outputs.image }}"

          # Substituir placeholder da imagem no deployment
          sed -i 's|316295889438.dkr.ecr.sa-east-1.amazonaws.com/agrosolutions-properties-api:latest|${{ steps.build-image.outputs.image }}|g' k8s/production/deployment.yaml

          echo "Verificando substituição da imagem:"
          grep "image:" k8s/production/deployment.yaml | head -5

          # Aplicar manifestos na ordem correta
          echo "📦 Aplicando namespace..."
          kubectl apply -f k8s/production/namespace.yaml

          echo "🔧 Aplicando ConfigMaps..."
          kubectl apply -f k8s/production/configmaps.yaml

          echo "💾 Aplicando Storage Class e Volumes..."
          kubectl apply -f k8s/production/storage-class.yaml
          kubectl apply -f k8s/production/volumes.yaml

          echo "🗄️ Deployando banco de dados..."
          kubectl apply -f k8s/production/databases.yaml

          echo "📡 Aplicando Services..."
          kubectl apply -f k8s/production/services.yaml

          echo "⏳ Aguardando banco de dados ficar pronto..."
          kubectl wait --for=condition=ready pod -l app=properties-db -n agrosolutions-properties --timeout=300s || true

          echo "🚀 Aplicando deployment da aplicação..."
          kubectl apply -f k8s/production/deployment.yaml

          echo "🔄 Aplicando HPA..."
          kubectl apply -f k8s/production/hpa.yaml

          echo "🌐 Aplicando Ingress..."
          kubectl apply -f k8s/production/ingress-aws.yaml

          echo "📊 Aplicando configurações de observabilidade..."
          kubectl apply -f k8s/production/observability.yaml

          echo "⚙️ Aplicando Resource Configs..."
          kubectl apply -f k8s/production/resource-configs.yaml

          echo "✅ Manifestos aplicados com sucesso!"

      - name: Verify Deployment
        run: |
          echo "🔍 Verificando status do deploy..."
          
          echo "Pods:"
          kubectl get pods -n agrosolutions-properties
          
          echo "Services:"
          kubectl get svc -n agrosolutions-properties
          
          echo "Ingress:"
          kubectl get ingress -n agrosolutions-properties

          # Aguardar rollout do deployment
          echo "⏳ Aguardando rollout da Properties API..."
          kubectl rollout status deployment/properties-api -n agrosolutions-properties --timeout=300s

          # Status final
          echo "📊 Status final dos deployments:"
          kubectl get deployments -n agrosolutions-properties
          kubectl get pods -n agrosolutions-properties -o wide

          # HPA status
          echo "📈 Status do HPA:"
          kubectl get hpa -n agrosolutions-properties

          # Teste de saúde
          echo "🏥 Testando health endpoint..."
          LOAD_BALANCER=$(kubectl get ingress properties-api-ingress -n agrosolutions-properties -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          
          if [ "$LOAD_BALANCER" != "pending" ] && [ -n "$LOAD_BALANCER" ]; then
            echo "Load Balancer: $LOAD_BALANCER"
            echo "Aguardando propagação do ingress (30s)..."
            sleep 30

            # Testar endpoint com retry
            for i in {1..5}; do
              echo "Tentativa $i/5 - Testando health endpoint..."
              if curl -f -H "Host: properties-api.agrosolutions.com" "http://$LOAD_BALANCER/health" --connect-timeout 10 --max-time 30; then
                echo "✅ Health check passou!"
                break
              else
                echo "⚠️ Health check falhou, tentando novamente em 10s..."
                sleep 10
              fi
              
              if [ $i -eq 5 ]; then
                echo "⚠️ Health check não passou após 5 tentativas (pode estar OK, ingress pode demorar a propagar)"
              fi
            done
          else
            echo "⏳ Load Balancer ainda não provisionado, verifique manualmente após alguns minutos"
          fi

          echo "🚀 Deploy concluído com sucesso!"

      - name: Deployment Summary
        if: success()
        run: |
          echo "📊 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build: SUCCESS"
          echo "✅ Docker Image: ${{ steps.build-image.outputs.image }}"
          echo "✅ Deployment: SUCCESS"
          echo "🌍 Environment: Production (AWS EKS)"
          echo "📅 Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🆔 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou. Executando rollback..."

          if kubectl cluster-info &> /dev/null; then
            echo "Conexão com Kubernetes OK, executando rollback..."
            
            if kubectl get deployment properties-api -n agrosolutions-properties &> /dev/null; then
              echo "⏪ Fazendo rollback da Properties API..."
              kubectl rollout undo deployment/properties-api -n agrosolutions-properties
            fi
            
            echo "✅ Rollback executado. Verifique os logs para detalhes do erro."
          else
            echo "❌ Não foi possível conectar ao Kubernetes. Rollback manual necessário."
            exit 1
          fi
