services:
  postgres:
    image: postgres:17-alpine
    container_name: agrosolutions-properties-db
    environment:
      POSTGRES_DB: agrosolutions_properties
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  properties-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrosolutions-properties-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=agrosolutions_properties;Username=postgres;Password=postgres"
      Jwt__Authority: "http://keycloak:8080/realms/agrosolutions"
      Jwt__Audience: "agrosolutions-api"
      AWS__Region: "sa-east-1"
      AWS__SQS__Queues__StatusChangedQueue: "agrosolutions-status-changed-queue"
      AWS__SQS__Queues__ProdutorSyncQueue: "agrosolutions-produtor-sync-queue"
      AWS__SNS__Topics__PropertiesEventsTopic: "arn:aws:sns:sa-east-1:405114419969:agrosolutions-property-events"
      # AWS Credentials (usar .env ou secrets em produção)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
