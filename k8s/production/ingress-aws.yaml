# Properties API não precisa de Ingress próprio
# O acesso público é via API Gateway: http://api.agrosolutions.site/properties/*
# O Ocelot roteia para properties-api-service.agrosolutions-properties:80
#
# Este Ingress existe apenas para debug direto ao serviço (sem passar pelo Gateway)

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: properties-api-ingress
  namespace: agrosolutions-properties
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/group.name: agrosolutions-shared
    alb.ingress.kubernetes.io/group.order: '40'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: properties-api.agrosolutions.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: properties-api-service
                port:
                  number: 80
