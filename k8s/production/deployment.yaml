---
# Properties API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: properties-api
  namespace: agrosolutions-properties
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: properties-api
  template:
    metadata:
      labels:
        app: properties-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agrosolutions-properties-sa  # IRSA - IAM Role for Service Accounts
      terminationGracePeriodSeconds: 30
      containers:
      - name: properties-api
        image: 316295889438.dkr.ecr.sa-east-1.amazonaws.com/agrosolutions-properties-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: properties-api-config
        env:
        # Database Connection String
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: connection-string
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
