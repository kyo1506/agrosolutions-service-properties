---
# Properties API Service
apiVersion: v1
kind: Service
metadata:
  name: properties-api-service
  namespace: agrosolutions-properties
  labels:
    app: properties-api
spec:
  selector:
    app: properties-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# Properties Database Service  
apiVersion: v1
kind: Service
metadata:
  name: properties-db-service
  namespace: agrosolutions-properties
  labels:
    app: properties-db
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  selector:
    app: properties-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
  type: ClusterIP
